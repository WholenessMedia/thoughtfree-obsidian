name: Release

# A tag named exactly as the manifest's version builds and attaches the three
# files Obsidian installs from, with an attestation of where they came from.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The tag is the manifest's version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
